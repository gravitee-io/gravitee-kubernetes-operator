# A real PKCS#12 keystore and its passwords, read from the signing-keystore Secret (see README, Setup)
# through GKO templates. AM key: am-runbook-signing-p12.
apiVersion: gravitee.io/v1alpha1
kind: AMCertificate
metadata:
  name: signing-p12
  namespace: am-runbook
  annotations:
    gravitee.io/drift-detection: "true"
spec:
  domainRef:
    name: comprehensive
  name: "[GKO] Signing PKCS#12"
  type: pkcs12-am-certificate
  configuration:
    content: '{"name":"keystore.p12","content":"[[ secret `signing-keystore/p12.b64` ]]"}'
    alias: signing
    storepass: "[[ secret `signing-keystore/storepass` ]]"
    keypass: "[[ secret `signing-keystore/storepass` ]]"
    algorithm: RS256
    use: [sig]
