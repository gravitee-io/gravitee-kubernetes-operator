# The domain's system certificate: AM builds it from its domains.certificates.default.* settings.
# name is set on purpose: AM ignores it (warning at admission) and must not make the certificate drift.
apiVersion: gravitee.io/v1alpha1
kind: AMCertificate
metadata:
  name: system-cert
  namespace: am-runbook
  annotations:
    gravitee.io/drift-detection: "true"
spec:
  domainRef:
    name: comprehensive
  system: true
  name: Ignored by AM
