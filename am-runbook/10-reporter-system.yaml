# The domain's system reporter: AM builds it from its domains.reporters.default.* settings; only the key
# (am-runbook-system-reporter) comes from here. name and the attribute mappings are set on purpose: AM ignores
# them (warning at admission) and they must not make the reporter drift.
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: system-reporter
  namespace: am-runbook
  annotations:
    gravitee.io/drift-detection: "true"
spec:
  domainRef:
    name: comprehensive
  system: true
  name: Ignored by AM
  attributeMappings:
    - expression: "{#context.attributes['client']}"
      exportedName: client
  attributeMappingEventTypes: [USER_LOGIN]
