# domain-comprehensive "inline-users", with the password read from the Secret through templating.
apiVersion: gravitee.io/v1alpha1
kind: AMIdentityProvider
metadata:
  name: inline-users
  namespace: am-runbook
  annotations:
    gravitee.io/drift-detection: "true"
spec:
  domainRef:
    name: comprehensive
  name: "[GKO] Inline users"
  type: inline-am-idp
  configuration:
    users:
      - firstname: Alice
        lastname: QA
        username: alice
        email: alice@example.com
        password: "[[ secret `inline-users/alice-password` ]]"
