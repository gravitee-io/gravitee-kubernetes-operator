# Optional (README 7.5): the password is resolved by AM's Kubernetes secret provider at load time, so it is
# never stored in AM. AM key: am-runbook-audit-kafka-am.
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: audit-kafka-am
  namespace: am-runbook
spec:
  domainRef:
    name: comprehensive
  name: "[GKO] Audit to Kafka, AM secrets"
  type: reporter-am-kafka
  configuration:
    bootstrapServers: kafka.am-runbook.svc:9092
    topic: gko-runbook-audit
    acks: "1"
    username: gravitee
    password: "{#secrets.get('/kubernetes/audit-kafka:password?namespace=am-runbook')}"
