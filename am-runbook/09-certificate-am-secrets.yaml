# Optional (README 6.3): passwords resolved by AM's Kubernetes secret provider at load time, so they
# are never stored in AM. Only the keystore file goes through a GKO template. AM key: am-runbook-signing-am.
apiVersion: gravitee.io/v1alpha1
kind: AMCertificate
metadata:
  name: signing-am
  namespace: am-runbook
spec:
  domainRef:
    name: comprehensive
  name: "[GKO] Signing, AM secrets"
  type: pkcs12-am-certificate
  configuration:
    content: '{"name":"keystore.p12","content":"[[ secret `signing-keystore/p12.b64` ]]"}'
    alias: signing
    storepass: "{#secrets.get('/kubernetes/signing-keystore:storepass?namespace=am-runbook')}"
    keypass: "{#secrets.get('/kubernetes/signing-keystore:storepass?namespace=am-runbook')}"
    algorithm: RS256
    use: [sig]
