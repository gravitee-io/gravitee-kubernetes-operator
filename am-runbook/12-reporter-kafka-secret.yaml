# A Kafka reporter, its password read from the audit-kafka Secret (see README 7.4) through a GKO template.
# AM stores the clear password and masks it on read. AM key: am-runbook-audit-kafka.
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: audit-kafka
  namespace: am-runbook
  annotations:
    gravitee.io/drift-detection: "true"
spec:
  domainRef:
    name: comprehensive
  name: "[GKO] Audit to Kafka"
  type: reporter-am-kafka
  configuration:
    bootstrapServers: kafka.am-runbook.svc:9092
    topic: gko-runbook-audit
    acks: "1"
    username: gravitee
    password: "[[ secret `audit-kafka/password` ]]"
