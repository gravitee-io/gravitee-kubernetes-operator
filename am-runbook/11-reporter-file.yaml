# A file reporter with attribute mappings. AM key: am-runbook-audit-file.
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: audit-file
  namespace: am-runbook
  annotations:
    gravitee.io/drift-detection: "true"
spec:
  domainRef:
    name: comprehensive
  name: "[GKO] Audit to file"
  type: reporter-am-file
  configuration:
    filename: gko-runbook-audit
    retainDays: 7
  attributeMappings:
    - expression: "{#context.attributes['client']}"
      exportedName: client
  attributeMappingEventTypes: [USER_LOGIN]
