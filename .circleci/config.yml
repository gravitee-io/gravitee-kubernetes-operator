version: 2.1

orbs:
  gravitee: gravitee-io/gravitee@4.18.1
  kubernetes: circleci/kubernetes@2.0.2
  helm: circleci/helm@3.2.0
  go: circleci/go@3.0.4
  keeper: gravitee-io/keeper@0.7.0
  slack: circleci/slack@5.2.3
  gh: circleci/github-cli@2.7.2
  azure-cli: circleci/azure-cli@1.3.2
  aquasec: gravitee-io/aquasec@1.0.5

parameters:
  go-version:
    type: string
    default: "1.26.0"
  helm-version:
    type: string
    default: "v3.19.4"
  kubernetes-version:
    type: string
    default: "v1.34.1"
  trigger:
    type: enum
    default: none
    enum:
      - test
      - e2e
      - rollout-apim
      - release
      - freeze
      - rebase-operatorhub
      - conformance
      - conformance-report
      - none
  conformance-version:
    type: string
    default: ""
    description: |
      The version to report Gateway API conformance for when the
      conformance-report trigger is used. The suite runs from the matching
      release branch and the job checks that impl.yaml declares this version.
  apim-source-branch:
    type: string
    default: ""
    description: |
      The branch that triggered a rollout of APIM on our side. 
      This branch belongs to the APIM repository.
  apim-commit-hash:
    type: string
    default: ""
    description: |
      The commit hash that triggered a roullout of APIM on our side. 
      This commit belongs to the APIM repository.
  release-version:
    type: string
    default: ""
    description: "The version being released when the release trigger is used"
  freeze-version:
    type: string
    default: ""
    description: "The version being frozen when the freeze trigger is used"
  latest:
    type: boolean
    default: false
    description: Is this version the latest version available when the release trigger is used ?
  dry-run:
    type: boolean
    default: true
  notify:
    type: boolean
    default: false

executors:
  azure-cli:
    docker:
      - image: mcr.microsoft.com/azure-cli:2.85.0
    resource_class: small

commands:
  # Everything both conformance jobs need before the suite can run: toolchain,
  # kind cluster, gateway image, load balancer, operator and GatewayClass.
  # The two jobs differ only in the box they run on and what they do with the
  # report afterwards, so the setup lives here rather than being duplicated.
  cmd-bootstrap-conformance:
    steps:
      - checkout
      - go/install:
          version: "<< pipeline.parameters.go-version >>"
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - go/load-mod-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - go/load-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - kubernetes/install_kubectl:
          kubectl_version: "<< pipeline.parameters.kubernetes-version >>"
      - helm/install_helm_client:
          version: "<< pipeline.parameters.helm-version >>"
      - run:
          name: Install kind
          command: |
            curl -Lo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
            chmod +x /tmp/kind
            sudo mv /tmp/kind /usr/local/bin/
      - gravitee/docker-login:
          registry: graviteeio.azurecr.io
          username: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/login
          password: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/password
      - run:
          name: Start cluster
          command: |
            make start-conformance-cluster
      - run:
          name: Prepare coverage storage
          command: |
            sudo chmod -R 777 /tmp/coverage
      - run:
          name: Create coverage persistent volume
          command:  kubectl apply -f ./test/conformance/coverage.yaml
      - run:
          name: Load gateway image
          command: |
            make kind-load-gateway
      - run:
          name: Install MetalLB
          command: |
            npx zx ./hack/scripts/install-metallb.mjs
      - run:
          name: Build and install the operator
          command: |
            IMG=gko TAG=latest make docker-build-cover \
              && kind load docker-image gko:latest --name gravitee \
              && helm upgrade --install gko helm/gko -n default \
                --set manager.image.repository=gko \
                --set manager.image.tag=latest \
                -f ./test/conformance/operator.values.yaml
      - run:
          name: Wait for operator to be ready
          command: |
            kubectl rollout status deployment/gko-controller-manager -n default --timeout=120s
      - run:
          name: Apply GatewayClassParameters and GatewayClass custom resources
          command: |
            kubectl apply -f ./test/conformance/gateway-class-parameters.yaml
            kubectl apply -f ./test/conformance/gateway-class.yaml

  # Everything needed to tell a flaky run from a broken one, captured on failure
  # only. Shared so both conformance jobs fail with the same evidence.
  cmd-dump-cluster-state:
    steps:
      - run:
          name: Dump cluster state
          when: on_fail
          command: |
            DUMP=/tmp/cluster-dump.txt
            {
              echo "===== gateways ====="
              kubectl get gateways -A -o wide
              echo "===== gateway status conditions ====="
              kubectl get gateways -A -o yaml
              echo "===== gateway deployments (labels and ownerReferences) ====="
              kubectl get deploy -A -l app.kubernetes.io/component=gateway -o yaml
              echo "===== pods ====="
              kubectl get pods -A -o wide
              echo "===== gateway pods ====="
              kubectl -n gateway-conformance-infra describe pods
              echo "===== httproutes ====="
              kubectl get httproutes -A -o yaml
              echo "===== generated api definitions ====="
              kubectl get apiv4definitions.gravitee.io -A -o yaml
              echo "===== generated route config maps ====="
              kubectl get cm -A -l gio-type=apidefinitions.gravitee.io -o yaml
              echo "===== operator reconcile errors ====="
              kubectl -n default logs deployment/gko-controller-manager --tail=-1 \
                | grep "Requeuing reconcile of resource" || echo "none"
              echo "===== gateway logs ====="
              kubectl -n gateway-conformance-infra logs -l app.kubernetes.io/component=gateway \
                --all-containers --prefix --tail=-1
              echo "===== operator logs ====="
              kubectl -n default logs deployment/gko-controller-manager --tail=-1
            } > "$DUMP" 2>&1 || true
            tail -c 100000 "$DUMP"
      - store_artifacts:
          path: /tmp/cluster-dump.txt
          destination: cluster-dump.txt
          when: on_fail

  cmd-setup-aqua-scan:
    steps:
      - keeper/env-export:
          secret-url: keeper://QeHHkvALPob4pgs1hMd9Gw/custom_field/API Key
          var-name: AQUA_KEY
      - keeper/env-export:
          secret-url: keeper://QeHHkvALPob4pgs1hMd9Gw/custom_field/Secret
          var-name: AQUA_SECRET
      - keeper/env-export:
          secret-url: keeper://LYg-wdlM5UDzSqFFH6Kyig/field/login
          var-name: AQUA_USERNAME
      - keeper/env-export:
          secret-url: keeper://LYg-wdlM5UDzSqFFH6Kyig/field/password
          var-name: AQUA_PASSWORD
      - keeper/env-export:
          secret-url: keeper://QeHHkvALPob4pgs1hMd9Gw/custom_field/ScannerToken
          var-name: SCANNER_TOKEN
      - keeper/env-export:
          secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
          var-name: GITHUB_TOKEN

jobs:

  job-lint-sources:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>-node
    steps:
      - checkout
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - go/load-mod-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - go/load-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - run:
          name: Lint sources
          command: make -j4 lint-sources

  job-lint-licenses:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>-node
    steps:
      - checkout
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - go/load-mod-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - go/load-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - run:
          name: Lint licenses
          command: make lint-licenses
      - go/save-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'

  job-lint-commits:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>-node
    steps:
      - checkout
      - run:
          name: Install commitlint
          command: npm i @commitlint/config-conventional @commitlint/cli
      - run:
          name: Lint commits
          command: |
            node_modules/.bin/commitlint \
              -x @commitlint/config-conventional \
              --from $(git describe --tags --abbrev=0)

  job-lint-resources:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - go/load-mod-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - go/load-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - run:
          name: Check that `make generate` has been executed
          command: |
            make generate
            git diff --quiet HEAD api/
      - run:
          name: Check that `make manifests` has been executed
          command: |
            make manifests
            git diff --quiet HEAD crds
      - run:
          name: Check that `make reference` has been executed
          command: |
            make reference
            git diff --quiet HEAD docs/api/reference.md
      - run:
          name: Check that `make helm-reference` has been executed
          command: |
            make helm-reference
            git diff --quiet HEAD helm/gko/README.md
      - go/save-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'

  job-unit-test:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>-node
    steps:
      - checkout
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - go/load-mod-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - go/load-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - run:
          name: Run unit tests
          command: |
            UT_ARGS="--cover --coverprofile=cover-unit.out --coverpkg=github.com/gravitee-io/gravitee-kubernetes-operator/... --output-dir=/tmp/junit/reports" \
             make -s unit
      - store_test_results:
          path: /tmp/junit/reports
      - persist_to_workspace:
          root: /tmp/junit/reports
          paths:
            - cover-unit.out
      - store_artifacts:
          path: /tmp/junit/reports/cover-unit.out
          destination: cover-unit.out
      - go/save-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'

  job-conformance-test:
    parameters:
      resource-class:
        type: string
        default: large
        description: |
          `large` (4 vCPU) is what the post-merge coverage run uses. It cannot
          carry the whole suite, hence skip-starved-tests. The scheduled run
          asks for a bigger box so it can run everything.
      skip-starved-tests:
        type: string
        default: "true"
        description: |
          Skips HTTPRouteWeight and HTTPRouteRedirectPortAndScheme, which starve
          on a small runner. Set to "false" on anything larger than `large`, and
          never true for a run whose result is meant as evidence.
    machine:
      image: ubuntu-2204:2024.01.2
      docker_layer_caching: false
    resource_class: << parameters.resource-class >>
    environment:
      CONFORMANCE_SKIP_STARVED_TESTS: << parameters.skip-starved-tests >>
    steps:
      - cmd-bootstrap-conformance
      - run:
          name: Run Gateway API conformance test suites
          command: |
            make conformance
      - cmd-dump-cluster-state
      - store_test_results:
          path: /tmp/junit/reports
          when: always
      - store_artifacts:
          path: /tmp/junit/reports/conformance-reruns.txt
          destination: conformance-reruns.txt
          when: always
      - run:
          name: Scale down operator manager.image.repository
          command: |
            kubectl scale deployment gko-controller-manager -n default --replicas=0
            kubectl wait --for=delete pod -l control-plane=controller-manager
      - run: 
          name: Generate coverage
          command: |
            mkdir -p /tmp/junit/reports
            go tool covdata textfmt  -i=/tmp/coverage -o /tmp/junit/reports/cover-conformance.out
      - persist_to_workspace:
          root: /tmp/junit/reports
          paths:
            - cover-conformance.out
      - store_artifacts:
          path: /tmp/junit/reports/cover-conformance.out
          destination: cover-conformance.out
      - go/save-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'

  # Produces the conformance report we publish upstream. Unlike
  # job-conformance-test this must run the complete suite: a skipped test makes
  # the report understate what GKO supports, and that is hard to walk back once
  # merged into kubernetes-sigs/gateway-api.
  #
  # The report is attached as an artifact whether the run passes or fails. It is
  # only committed, and only pushed to the fork, when nothing failed and nothing
  # was skipped.
  job-conformance-report:
    machine:
      image: ubuntu-2204:2024.01.2
      docker_layer_caching: false
    # The suite starves on `large`, which is what forced the two CIRCLECI-only
    # skips this job exists to remove. Do not lower this without re-checking
    # that HTTPRouteWeight and HTTPRouteRedirectPortAndScheme still pass.
    resource_class: xlarge
    environment:
      # Read by the *test binary* to decide whether HTTPRouteMatchingAcrossRoutes
      # runs. This is NOT the value operator.values.yaml sets on the operator
      # pod: same name, different process, and setting one does nothing for the
      # other. Leaving it unset here is what produced the stale partial reports.
      GATEWAY_API_MATCH_ACROSS_ROUTES: "true"
      # A test that only passed on a retry did fail. A published report may not
      # contain one.
      CONFORMANCE_RERUN: "0"
    steps:
      - cmd-bootstrap-conformance
      - add_ssh_keys:
          fingerprints:
            - ac:88:23:8f:c6:0f:7d:f0:fc:df:73:20:34:56:02:6c
      # Fail in seconds rather than after a 30 minute suite run if the branch
      # does not declare the version that was asked for.
      - run:
          name: Check impl.yaml declares the requested version
          command: |
            REQUESTED="<< pipeline.parameters.conformance-version >>"
            DECLARED=$(awk '/^version:/{print $2}' \
              test/conformance/kubernetes.io/gateway-api/impl/impl.yaml)
            echo "Requested: ${REQUESTED} | declared by impl.yaml: ${DECLARED}"
            if [ "${REQUESTED}" != "${DECLARED}" ]; then
              echo "Refusing to run: this branch reports as ${DECLARED}, not ${REQUESTED}."
              exit 1
            fi
      - run:
          name: Run Gateway API conformance test suites
          command: |
            make conformance
      - cmd-dump-cluster-state
      # Always, so a failed run is still diagnosable from the report itself.
      - store_artifacts:
          path: test/conformance/kubernetes.io/gateway-api/report
          destination: report
          when: always
      - store_test_results:
          path: /tmp/junit/reports
          when: always
      - store_artifacts:
          path: /tmp/junit/reports/conformance.xml
          destination: conformance.xml
          when: always
      # Everything past here is skipped when the suite failed, which is the
      # "commit only on success" half of the contract. The zero-skips half is
      # enforced inside the script.
      - run:
          name: Commit conformance report
          command: |
            npx zx hack/scripts/commit-conformance-report.mjs \
              --version << pipeline.parameters.conformance-version >> \
              --dry-run << pipeline.parameters.dry-run >>
      - run:
          name: Prepare upstream submission branch
          command: |
            npx zx hack/scripts/submit-conformance-report.mjs \
              --version << pipeline.parameters.conformance-version >> \
              --dry-run << pipeline.parameters.dry-run >> \
              --output /tmp/submission.json
      - store_artifacts:
          path: /tmp/submission.json
          destination: submission.json

  job-integration-test:
    machine:
      image: ubuntu-2204:2024.01.2
      docker_layer_caching: true
    resource_class: medium
    parameters:
      ginkgo-filter:
        type: enum
        enum:
          - withContext
          - withoutContext
    steps:
      - checkout
      - go/install:
          version: "<< pipeline.parameters.go-version >>"
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - go/load-mod-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - go/load-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'
      - kubernetes/install_kubectl:
          kubectl_version: "<< pipeline.parameters.kubernetes-version >>"
      - helm/install_helm_client:
          version: "<< pipeline.parameters.helm-version >>"
      - run:
          name: Install kind
          command: |
            curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
            chmod +x /tmp/kind
            sudo mv /tmp/kind /usr/local/bin/
      - gravitee/docker-login:
          registry: graviteeio.azurecr.io
          username: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/login
          password: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/password
      - run:
          name: Create junit reports directory
          command: mkdir -p "/tmp/junit/reports"
      - when:
          condition:
            equal:
              - withoutContext
              - << parameters.ginkgo-filter >>
          steps:
            - run:
                command: echo 'export APIM_VALUES=values-dbless.yaml' >> $BASH_ENV
      - run:
          name: Start cluster
          no_output_timeout: 30m
          command: make start-cluster
      - run:
          name: Run IT with filter << parameters.ginkgo-filter >>
          no_output_timeout: 30m
          command: |
            export SAFE_RANDOM=true
            export GKO_MANAGER_SILENT_LOG=true
            IT_ARGS="--label-filter=<< parameters.ginkgo-filter >> --flake-attempts=2 --cover --coverprofile=cover-<< parameters.ginkgo-filter >>.out --coverpkg=github.com/gravitee-io/gravitee-kubernetes-operator/... --output-dir=/tmp/junit/reports" make -s it
      - store_test_results:
          path: /tmp/junit/reports
      - persist_to_workspace:
          root: /tmp/junit/reports
          paths:
            - cover-<< parameters.ginkgo-filter >>.out
      - store_artifacts:
          path: /tmp/junit/reports/cover-<< parameters.ginkgo-filter >>.out
          destination: cover-<< parameters.ginkgo-filter >>.out
      - go/save-build-cache:
          checksum: '{{ checksum "/tmp/gomod_checksum.md5" }}'

  job-e2e-tests:
    machine:
      image: ubuntu-2204:2024.01.2
      docker_layer_caching: true
    resource_class: large
    steps:
      - checkout
      - go/install:
          version: "<< pipeline.parameters.go-version >>"
      - run:
          name: Generate cache keys for Go tools
          command: find . -name go.mod -exec md5sum {} \; | sort -k 2 > /tmp/gomod_checksum.md5
      - kubernetes/install_kubectl:
          kubectl_version: "<< pipeline.parameters.kubernetes-version >>"
      - helm/install_helm_client:
          version: "<< pipeline.parameters.helm-version >>"
      - run:
          name: Install kind
          command: |
            curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
            chmod +x /tmp/kind
            sudo mv /tmp/kind /usr/local/bin/
      - gravitee/docker-login:
          registry: graviteeio.azurecr.io
          username: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/login
          password: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/password
      - run:
          name: Start cluster
          command: |
            make start-cluster
      - run:
          name: Prepare coverage storage
          command: |
            sudo chmod -R 777 /tmp/coverage
      - run:
          name: Create coverage persistent volume
          command: kubectl apply -f ./test/e2e/coverage.yaml
      - run:
          name: Helm install GKO
          command: |
            IMG=gko TAG=latest make docker-build-cover \
              && kind load docker-image gko:latest --name gravitee \
              && helm upgrade --install gko helm/gko -n default \
                --set manager.image.repository=gko \
                --set manager.image.tag=latest \
                -f ./test/e2e/operator.values.yaml
      - run:
          name: Build platform-test CLI
          command: npm --prefix test/platform-test install && npm --prefix test/platform-test run build
      - run:
          name: Install Terraform
          command: |
            curl -fsSL https://releases.hashicorp.com/terraform/1.12.1/terraform_1.12.1_linux_amd64.zip -o /tmp/terraform.zip
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
            terraform version
      - run:
          name: Build Gravitee Terraform provider from source
          # Some e2e tests exercise provider features merged to main but not
          # yet on registry.terraform.io. The script builds the provider from
          # source and stages it into a filesystem mirror that
          # helpers/terraform.ts auto-detects via TF_CLI_CONFIG_FILE.
          # Override the ref via the TF_PROVIDER_REF pipeline env var when a
          # specific commit/tag must be tested instead of main.
          command: |
            bash test/platform-test/scripts/build-tf-provider.sh "${TF_PROVIDER_REF:-main}"
      - run:
          name: Wait for operator to be ready
          command: |
            kubectl rollout status deployment/gko-controller-manager -n default --timeout=120s
      # Export the Xray Cloud API credentials BEFORE the e2e run. keeper/env-export
      # runs on_success, so placing it here (while the pipeline is still green)
      # guarantees the creds are in BASH_ENV for the `when: always` push step below
      # even when the e2e run itself fails.
      - keeper/env-export:
          secret-url: keeper://so8_Jh2tP-AZSbtIYcbBvg/custom_field/CLIENT ID
          var-name: XRAY_CLIENT_ID
      - keeper/env-export:
          secret-url: keeper://so8_Jh2tP-AZSbtIYcbBvg/custom_field/CLIENT SECRET
          var-name: XRAY_CLIENT_SECRET
      - run:
          name: Run Playwright E2E tests
          command: npm --prefix test/platform-test run e2e
      - run:
          name: Scale down operator
          command: |
            kubectl scale deployment gko-controller-manager -n default --replicas=0
            kubectl wait --for=delete pod -l control-plane=controller-manager --timeout=60s
      - run:
          name: Generate coverage
          command: |
            mkdir -p /tmp/junit/reports
            go tool covdata textfmt -i=/tmp/coverage -o /tmp/junit/reports/cover-e2e.out
      - persist_to_workspace:
          root: /tmp/junit/reports
          paths:
            - cover-e2e.out
      - store_test_results:
          path: test/platform-test/playwright-results
      - store_artifacts:
          path: test/platform-test/playwright-results
          destination: playwright-results
      - store_artifacts:
          path: test/platform-test/playwright-report
          destination: playwright-report
      - store_artifacts:
          path: /tmp/junit/reports/cover-e2e.out
          destination: cover-e2e.out
      # Best-effort push of the Playwright JUnit results to Xray Cloud so the
      # "Test Coverage" panel on each linked Jira Test reflects the latest run.
      # See test/platform-test/scripts/xray/README.md for env-var setup. Runs
      # `when: always` so failed test runs still surface their failures in Jira
      # instead of leaving the panel stuck at TO DO. The XRAY_CLIENT_* creds are
      # exported earlier (before the e2e run) by keeper/env-export.
      - run:
          name: Push results to Xray Cloud
          when: always
          command: ./test/platform-test/scripts/xray/push-results.sh
      # Note: store_artifacts can't take `when: always`; if e2e fails this
