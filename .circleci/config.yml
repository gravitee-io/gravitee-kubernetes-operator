            make olm-bundle \
              VERSION=<< pipeline.parameters.release-version >> \
              IMG=docker.io/graviteeio/kubernetes-operator \
              CHANNELS=stable-v${MINOR},alpha \
              DEFAULT_CHANNEL=stable-v${MINOR}
      - run:
          name: Build OLM bundle image
          command: |
