                  docker buildx build \
                    --platform=linux/arm64,linux/amd64 \
                    -t graviteeio/kubernetes-operator:<< pipeline.parameters.release-version >> \
                    ./
      - when:
          condition:
            and:
              - << pipeline.parameters.dry-run >>
