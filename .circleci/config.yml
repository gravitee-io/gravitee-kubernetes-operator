workflows:
  pre-merge:
    when:
      equal:
        - none
        - << pipeline.parameters.trigger >>
    jobs:
      - job-lint-sources:
          name: Lint sources
      - job-lint-licenses:
          name: Lint licenses
      - job-lint-commits:
          name: Lint commits
      - job-lint-resources:
          name: Lint resources
      - job-unit-test:
          name: Run unit tests
      - job-integration-test:
          matrix:
            parameters:
              ginkgo-filter:
                - withContext
                - withoutContext
          context: cicd-orchestrator
      # No conformance job here on purpose. It is the flakiest thing we run and
      # blocking every PR on it cost more than it caught. It still runs
      # post-merge on master (for coverage) and every Monday on a box big enough
      # to run the whole suite. To check a branch before merging, trigger the
      # Schedule Conformance Test Suite action against it.
      - job-helm-lint:
          name: Lint Helm chart
      - job-helm-test:
          name: Test Helm chart
          requires:
            - Lint Helm chart
      - aquasec/fs_scan:
          context: cicd-orchestrator
          pre-steps:
            - cmd-setup-aqua-scan
  post-merge:
    when:
      equal:
        - none
        - << pipeline.parameters.trigger >>
    jobs:
      - aquasec/fs_scan:
          name: Scan code repository
          context: cicd-orchestrator
          pre-steps:
            - cmd-setup-aqua-scan
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+\.x$/
                - master
                - ci-stage-helm-chart
            tags:
              ignore: /.*/
      - job-stage-image:
          name: Stage Docker image
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+\.x$/
                - master
                - ci-stage-helm-chart
            tags:
              ignore: /.*/
      - job-stage-helm-chart:
          name: Stage Helm chart
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+\.x$/
                - master
                - ci-stage-helm-chart
            tags:
              ignore: /.*/
      - job-rollout-operator:
          name: Rollout Operator
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+\.x$/
                - master
                - ci-stage-helm-chart
            tags:
              ignore: /.*/
          requires:
            - Stage Docker image
            - Stage Helm chart 
      - job-e2e-tests:
          name: Run end to end tests
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - master
          post-steps:
              - slack/notify:
                  channel: C098YUEDMGE
                  event: fail
                  template: basic_fail_1
                  branch_pattern: ".+"
              - slack/notify:
                  channel: C098YUEDMGE
                  event: pass
                  template: basic_success_1
                  branch_pattern: ".+"
      - job-unit-test:
          name: Run unit tests (master)
          filters:
            branches:
              only:
                - master
      - job-integration-test:
          matrix:
            parameters:
              ginkgo-filter:
                - withContext
                - withoutContext
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - master
      - job-conformance-test:
          name: Run Conformance Test (master)
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - master
      - job-sonarcloud-analysis:
          name: Sonarcloud analysis
          context: cicd-orchestrator
          requires:
            - job-integration-test-withContext
            - job-integration-test-withoutContext
            - Run Conformance Test (master)
            - Run end to end tests
          filters:
            branches:
              only:
                - master

      - aquasec/register_artifact:
          name: Register staged image for scanning
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+\.x$/
                - master
                - ci-stage-helm-chart
            tags:
              ignore: /.*/
          requires:
            - Stage Docker image
          built_docker_image_file: /tmp/docker-image.txt
          pre-steps:
            - checkout
            - cmd-setup-aqua-scan
            - run:
                name: Store docker image version
                command: |
                  export VERSION="$(npx zx hack/scripts/get-chart-version.mjs)"
                  echo "graviteeio.azurecr.io/kubernetes-operator:${VERSION}" > /tmp/docker-image.txt
      - aquasec/docker_image_scan:
          name: Scan staged image
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+\.x$/
                - master
                - ci-stage-helm-chart
            tags:
              ignore: /.*/
          requires:
            - Register staged image for scanning
          scanner_url: https://82fb8f75da.cloud.aquasec.com
          built_docker_image_file: /tmp/docker-image.txt
          pre-steps:
            - checkout
            - cmd-setup-aqua-scan
            - run:
                name: Store docker image version
                command: |
                  export VERSION="$(npx zx hack/scripts/get-chart-version.mjs)"
                  echo "graviteeio.azurecr.io/kubernetes-operator:${VERSION}" > /tmp/docker-image.txt
            - gravitee/docker-login:
                registry: graviteeio.azurecr.io
                username: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/login
                password: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/password
            - run:
                name: Pull Docker image
                command: |
                  export VERSION="$(npx zx hack/scripts/get-chart-version.mjs)"
                  docker pull "graviteeio.azurecr.io/kubernetes-operator:${VERSION}"
             
  release:
    when:
      equal:
        - release
        - << pipeline.parameters.trigger >>
    jobs:
      - job-release:
          name: Release
          context: cicd-orchestrator
      - job-notify-release-slack:
          name: Notify release on Slack
          context: cicd-orchestrator
          requires:
            - Release
      - aquasec/register_artifact:
          name: Register release artifact
          context: cicd-orchestrator
          requires:
            - Release
          built_docker_image_file: /tmp/docker-image.txt
          pre-steps:
            - run:
                name: Skip on dry run
                command: |
                  if [ "<< pipeline.parameters.dry-run >>" = "true" ]; then
                    circleci-agent step halt
                  fi
            - cmd-setup-aqua-scan
            - run:
                name: Store docker image version
                command: echo "graviteeio/kubernetes-operator:<< pipeline.parameters.release-version >>" > /tmp/docker-image.txt
      - aquasec/docker_image_scan:
          name: Scan release image
          context: cicd-orchestrator
          requires:
            - Register release artifact
          scanner_url: https://82fb8f75da.cloud.aquasec.com
          built_docker_image_file: /tmp/docker-image.txt
          pre-steps:
            - run:
                name: Skip on dry run
                command: |
                  if [ "<< pipeline.parameters.dry-run >>" = "true" ]; then
                    circleci-agent step halt
                  fi
            - cmd-setup-aqua-scan
            - run:
                name: Store docker image version
                command: echo "graviteeio/kubernetes-operator:<< pipeline.parameters.release-version >>" > /tmp/docker-image.txt
            - run:
                name: Pull docker image
                command: docker pull "graviteeio/kubernetes-operator:<< pipeline.parameters.release-version >>"

  freeze:
    when:
      equal:
        - freeze
        - << pipeline.parameters.trigger >>
    jobs:
      - job-freeze:
          name: Freeze
          context: cicd-orchestrator

  test:
    when:
      equal:
        - test
        - << pipeline.parameters.trigger >>
    jobs:
      - job-integration-test:
          matrix:
            parameters:
              ginkgo-filter:
                - withContext
                - withoutContext
          context: cicd-orchestrator
          pre-steps:
            - keeper/env-export:
                secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
                var-name: SLACK_ACCESS_TOKEN
          post-steps:
            - when:
                condition: << pipeline.parameters.notify >>
                steps:
                  - slack/notify:
                      channel: C07QP2Z7Z9V
                      event: fail
                      template: basic_fail_1
                      branch_pattern: ".+"
                  - slack/notify:
                      channel: C07QP2Z7Z9V
                      event: pass
                      template: basic_success_1
                      branch_pattern: ".+"

  
  # Weekly and on demand, from the Schedule Conformance Test Suite action.
  # Runs the complete suite on a bigger box: the point of this run is to know
  # whether we are conformant, which a run with skips cannot answer.
  conformance:
    when:
      equal:
        - conformance
        - << pipeline.parameters.trigger >>
    jobs:
      - job-conformance-test:
          name: Run Conformance Test
          resource-class: xlarge
          skip-starved-tests: "false"
          context: cicd-orchestrator
          pre-steps:
            - keeper/env-export:
                secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
                var-name: SLACK_ACCESS_TOKEN
          post-steps:
            - when:
                condition: << pipeline.parameters.notify >>
                steps:
                  - slack/notify:
                      channel: C0BLQ42FY9Z
                      event: fail
                      template: basic_fail_1
                      branch_pattern: ".+"
                  - slack/notify:
                      channel: C0BLQ42FY9Z
                      event: pass
                      template: basic_success_1
                      branch_pattern: ".+"

  conformance-report:
    when:
      equal:
        - conformance-report
        - << pipeline.parameters.trigger >>
    jobs:
      - job-conformance-report:
          name: Report conformance for << pipeline.parameters.conformance-version >>
          context: cicd-orchestrator

  e2e-test:
    when:
      equal:
        - e2e
        - << pipeline.parameters.trigger >>
    jobs:
      - job-e2e-tests:
          name: Run end to end tests
          context: cicd-orchestrator
          post-steps:
            - when:
                condition: << pipeline.parameters.notify >>
                steps:
                  - slack/notify:
                      channel: C098YUEDMGE
                      event: fail
                      template: basic_fail_1
                      branch_pattern: ".+"
                  - slack/notify:
                      channel: C098YUEDMGE
                      event: pass
                      template: basic_success_1
                      branch_pattern: ".+"

  rollout-apim:
    when:
      equal:
        - rollout-apim
        - << pipeline.parameters.trigger >>
    jobs:
      - job-rollout-apim:
          name: Rollout APIM components
          context: cicd-orchestrator
          apim-source-branch: << pipeline.parameters.apim-source-branch >>
          apim-commit-hash: << pipeline.parameters.apim-commit-hash >>

  rebase-operatorhub:
    when:
      equal:
        - rebase-operatorhub
        - << pipeline.parameters.trigger >>
    jobs:
      - job-rebase-operatorhub:
          name: Rebase OperatorHub PRs
          context: cicd-orchestrator
          filters:
            branches:
              only:
                - master
            tags:
              ignore: /.*/
