suite: webhook service
templates:
  - "webhook/mutation-webhook.yaml"
tests:
  - it: Should have Mutating Webhook Configuration
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: MutatingWebhookConfiguration
      - isAPIVersion:
          of: admissionregistration.k8s.io/v1
      - equal:
          path: metadata.name
          value: gko-mutating-webhook-configurations
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: Should not have Mutating Webhook Configuration with webhook disabled
    set:
      manager:
        webhook:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Should give webhooks headroom over the default HTTP client timeout
    asserts:
      - equal:
          path: webhooks[*].timeoutSeconds
          value: 10

  - it: Should follow the HTTP client timeout
    set:
      manager:
        httpClient:
          timeoutSeconds: 20
    asserts:
      - equal:
          path: webhooks[*].timeoutSeconds
          value: 25

  - it: Should cap the webhook timeout to the maximum accepted by Kubernetes
    set:
      manager:
        httpClient:
          timeoutSeconds: 40
    asserts:
      - equal:
          path: webhooks[*].timeoutSeconds
          value: 30
