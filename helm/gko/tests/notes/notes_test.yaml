suite: release notes
templates:
  - "NOTES.txt"
tests:
  - it: Should warn that the Ingress controller is deprecated when it is enabled
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: The Gravitee Ingress controller is deprecated"

  - it: Should not warn when the Ingress controller is disabled
    set:
      ingress:
        controller:
          enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: "Ingress controller is deprecated"
