# A native Kafka API with the connection-metrics reporter turned back on. Both
# variants share one CR name so update() re-applies over the previous one.
#
# The listener host and the plan's broker port range are unique to this arm:
# APIM admission enforces global uniqueness on both, so a native fixture that
# borrows another's identity makes the suite order-dependent.
#
# STOPPED on purpose. Starting a native API makes the gateway bind the broker
# port range, which the test cluster is not set up for, and the reporter flag is
# control-plane configuration that is readable either way.
apiVersion: gravitee.io/v1alpha1
kind: ApiV4Definition
metadata:
  name: observability-native-api
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "observability-native-api"
  description: "Native Kafka API whose connection-metrics reporter is toggled"
  version: "1.0"
  type: NATIVE
  state: STOPPED
  analytics:
    enabled: true
    reporterMetricsEnabled: true
  listeners:
    - type: KAFKA
      host: "kafka-observability-gko.example.local"
      port: 9092
      entrypoints:
        - type: native-kafka
          qos: AUTO
  endpointGroups:
    - name: Default Kafka group
      type: native-kafka
      endpoints:
        - name: Default Kafka endpoint
          type: native-kafka
          inheritConfiguration: false
          configuration:
            bootstrapServers: "kafka-observability-gko.example.local:9092"
          sharedConfigurationOverride:
            security:
              protocol: PLAINTEXT
  plans:
    KeyLess:
      name: "Free plan"
      security:
        type: "KEY_LESS"
      bootstrapPort: 9392
      brokerRangeStart: 9400
      brokerRangeEnd: 9402
