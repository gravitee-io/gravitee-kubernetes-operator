# The journey's MESSAGE API exposing a websocket HTTP entrypoint alongside the constant
# webhook subscription entrypoint, over a mock message endpoint. One CR name
# across every variant, so update() re-applies over the previous one and the
# listener set, description and version all have to change in place.
apiVersion: gravitee.io/v1alpha1
kind: ApiV4Definition
metadata:
  name: message-api
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "message-api"
  description: "V4 MESSAGE (event) API exposing a websocket entrypoint"
  version: "4.0.0"
  type: MESSAGE
  state: STARTED
  definitionContext:
    origin: KUBERNETES
    syncFrom: KUBERNETES
  listeners:
    - type: HTTP
      paths:
        - path: "/message-api"
      entrypoints:
        - type: websocket
          qos: AUTO
    - type: SUBSCRIPTION
      entrypoints:
        - type: webhook
          qos: AUTO
  endpointGroups:
    - name: Default Mock group
      type: mock
      endpoints:
        - name: Default Mock endpoint
          type: mock
          inheritConfiguration: false
          configuration:
            messageInterval: 1000
            messageContent: '{"message": "hello from mock"}'
            messagesCount: 1
  flowExecution:
    mode: DEFAULT
    matchRequired: false
  plans:
    KeyLess:
      name: "Free plan"
      security:
        type: "KEY_LESS"
