# The console notification the API subscribes to, on the API's start/stop events. GKO models this
# as a standalone Notification CR the API references; Terraform inlines the same
# thing as apim_apiv4.console_notification. Both variants share one CR name so
# the journey's update() re-applies over the previous one.
apiVersion: gravitee.io/v1alpha1
kind: Notification
metadata:
  name: api-console-notification
  labels:
    gravitee.io/e2e: "true"
spec:
  target: console
  eventType: api
  console:
    apiEvents:
      - API_STARTED
      - API_STOPPED
    groupRefs:
      - name: notified-group
