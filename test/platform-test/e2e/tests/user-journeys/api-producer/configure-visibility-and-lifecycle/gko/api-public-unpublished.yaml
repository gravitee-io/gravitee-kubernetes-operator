# The journey's API with visibility=PUBLIC, lifecycleState=UNPUBLISHED. All three
# variants share one CR name, so the journey's update() re-applies over the
# previous one and APIM has to change the record IN PLACE.
apiVersion: gravitee.io/v1alpha1
kind: ApiV4Definition
metadata:
  name: portal-visibility-api
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "portal-visibility-api"
  description: "V4 proxy API whose portal visibility and lifecycle state the journey changes"
  version: "1.0"
  type: PROXY
  state: STARTED
  visibility: PUBLIC
  lifecycleState: UNPUBLISHED
  listeners:
    - type: HTTP
      paths:
        - path: "/portal-visibility-api"
      entrypoints:
        - type: http-proxy
          qos: AUTO
  endpointGroups:
    - name: Default HTTP proxy group
      type: http-proxy
      endpoints:
        - name: Default HTTP proxy
          type: http-proxy
          inheritConfiguration: false
          configuration:
            target: https://api.gravitee.io/echo
  flowExecution:
    mode: DEFAULT
    matchRequired: false
  plans:
    KeyLess:
      name: "Free plan"
      security:
        type: "KEY_LESS"
