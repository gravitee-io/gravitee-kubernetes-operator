# Document a V4 API with a page whose content is fetched from a URL, through GKO.
# The page carries no content of its own: spec.pages.<hrid>.source declares the
# fetcher and APIM pulls the spec in. (metadata.labels carries the e2e sweep
# marker; spec.pages is the documentation under test.)
apiVersion: gravitee.io/v1alpha1
kind: ApiV4Definition
metadata:
  name: fetched-docs-api
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "fetched-docs-api"
  description: "V4 proxy API documented with a spec fetched over HTTP"
  version: "1.0.0"
  type: PROXY
  state: STARTED
  definitionContext:
    origin: KUBERNETES
    syncFrom: MANAGEMENT
  listeners:
    - type: HTTP
      paths:
        - path: "/fetched-docs-api"
      entrypoints:
        - type: http-proxy
          qos: AUTO
  endpointGroups:
    - name: Default HTTP proxy group
      type: http-proxy
      endpoints:
        - name: Default HTTP proxy
          type: http-proxy
          inheritConfiguration: false
          configuration:
            target: https://api.gravitee.io/echo
  flowExecution:
    mode: DEFAULT
    matchRequired: false
  plans:
    KeyLess:
      name: "Free plan"
      security:
        type: "KEY_LESS"
  pages:
    petstore-spec:
      name: "API reference"
      type: SWAGGER
      published: true
      source:
        type: http-fetcher
        configuration:
          url: https://petstore.swagger.io/v2/swagger.json
          autoFetch: true
          fetchCron: "*/10 * * * * *"
          useSystemProxy: false
