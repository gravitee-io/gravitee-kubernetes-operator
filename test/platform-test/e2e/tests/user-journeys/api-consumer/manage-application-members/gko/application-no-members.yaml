# The journey's application, with the membership revoked. All variants share one CR name so
# update() re-applies over the previous one and the membership has to change in
# place.
apiVersion: gravitee.io/v1alpha1
kind: Application
metadata:
  name: shared-application
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "shared-application"
  description: "Application whose membership the journey grants, changes and revokes"
  notifyMembers: false
  settings:
    app:
      type: "SIMPLE"
      clientId: "shared-application-client"
