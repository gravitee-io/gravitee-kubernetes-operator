# Subscription from the journey's application to the JWT plan. Applied only
# after the API and the application have reconciled: APIM's subscription endpoint
# rejects an application it still considers archived.
apiVersion: gravitee.io/v1alpha1
kind: Subscription
metadata:
  name: secured-plans-sub-jwt
  labels:
    gravitee.io/e2e: "true"
spec:
  api:
    name: "secured-plans-api"
    kind: "ApiV4Definition"
  plan: "JWTPlan"
  application:
    name: "secured-plans-app"
