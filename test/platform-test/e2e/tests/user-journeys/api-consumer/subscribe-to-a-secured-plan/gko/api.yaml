# The API the journey subscribes to: one JWT plan and one OAuth2 plan, both set
# to MANUAL validation on purpose. A subscription written through the Automation
# API is auto-validated regardless, which is what the journey asserts.
apiVersion: gravitee.io/v1alpha1
kind: ApiV4Definition
metadata:
  name: secured-plans-api
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "secured-plans-api"
  description: "V4 proxy API exposing a JWT plan and an OAuth2 plan, both manually validated"
  version: "1.0"
  type: PROXY
  state: STARTED
  # APIM otherwise rejects the second subscription with
  # "An other OAuth2 or JWT plan is already subscribed by the same application".
  allowMultiJwtOauth2Subscriptions: true
  # Declared alongside it because both govern how this API may be consumed. APIM
  # exposes no product surface through either driver, so the journey can only
  # assert that the flag round-trips.
  allowedInApiProducts: true
  listeners:
    - type: HTTP
      paths:
        - path: "/secured-plans-api"
      entrypoints:
        - type: http-proxy
          qos: AUTO
  endpointGroups:
    - name: Default HTTP proxy group
      type: http-proxy
      endpoints:
        - name: Default HTTP proxy
          type: http-proxy
          inheritConfiguration: false
          configuration:
            target: https://api.gravitee.io/echo
  flowExecution:
    mode: DEFAULT
    matchRequired: false
  plans:
    JWTPlan:
      name: "JWT plan"
      type: "API"
      status: "PUBLISHED"
      validation: MANUAL
      security:
        type: "JWT"
    OAuth2Plan:
      name: "OAuth2 plan"
      type: "API"
      status: "PUBLISHED"
      validation: MANUAL
      security:
        type: "OAUTH2"
