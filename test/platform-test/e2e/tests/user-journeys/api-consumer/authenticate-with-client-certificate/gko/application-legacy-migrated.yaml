# The same application moved off the deprecated field onto the list, swapping in client2.
# Every stage of this journey shares one CR name, so update() re-applies over the
# previous stage and the certificate set has to change in place.
apiVersion: gravitee.io/v1alpha1
kind: Application
metadata:
  name: mtls-legacy-cert-app
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "mtls-legacy-cert-app"
  description: "Application authenticating to an mTLS plan with a client certificate"
  settings:
    app:
      type: SIMPLE
      clientId: mtls-legacy-cert-app-client
    tls:
      clientCertificates:
        - name: client2
