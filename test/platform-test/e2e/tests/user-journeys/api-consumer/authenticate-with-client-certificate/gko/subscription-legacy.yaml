# Subscribes the journey's application to the API's mTLS plan. Without it the
# gateway has no link between the presented certificate and the application.
apiVersion: gravitee.io/v1alpha1
kind: Subscription
metadata:
  name: mtls-legacy-cert-sub
  labels:
    gravitee.io/e2e: "true"
spec:
  api:
    name: mtls-legacy-cert
  application:
    name: mtls-legacy-cert-app
  plan: MTLS
