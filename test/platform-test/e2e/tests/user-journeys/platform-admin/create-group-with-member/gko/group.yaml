# A group with a single member, created through GKO. Lands in APIM via the
# Automation API (origin KUBERNETES).
apiVersion: gravitee.io/v1alpha1
kind: Group
metadata:
  name: simple-group
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "simple-group"
  notifyMembers: false
  members:
    # A gravitee-source service account, created by the journey. `admin` is a
    # memory-source user, so naming it here would resolve to nothing and the
    # group would silently come back with no members at all.
    - source: gravitee
      sourceId: e2e-sa-group-member
      roles:
        API: USER
