# The journey's API, associated with the group. Both variants share one CR name so
# update() re-applies over the previous one and the association has to change in
# place.
apiVersion: gravitee.io/v1alpha1
kind: ApiV4Definition
metadata:
  name: api-in-a-group
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "api-in-a-group"
  description: "V4 proxy API the journey associates with a group and then detaches"
  version: "1.0"
  type: PROXY
  state: STARTED
  groups:
    - "api-owning-group"
  listeners:
    - type: HTTP
      paths:
        - path: "/api-in-a-group"
      entrypoints:
        - type: http-proxy
          qos: AUTO
  endpointGroups:
    - name: Default HTTP proxy group
      type: http-proxy
      endpoints:
        - name: Default HTTP proxy
          type: http-proxy
          inheritConfiguration: false
          configuration:
            target: https://api.gravitee.io/echo
  flowExecution:
    mode: DEFAULT
    matchRequired: false
  plans:
    KeyLess:
      name: "Free plan"
      security:
        type: "KEY_LESS"
