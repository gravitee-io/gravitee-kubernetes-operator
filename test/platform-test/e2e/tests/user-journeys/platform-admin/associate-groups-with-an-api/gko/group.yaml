# The group the journey associates with its API. Applied and reconciled BEFORE
# the API: APIM silently drops a reference to a group that does not exist yet.
apiVersion: gravitee.io/v1alpha1
kind: Group
metadata:
  name: api-owning-group
  labels:
    gravitee.io/e2e: "true"
spec:
  contextRef:
    name: "dev-ctx"
    namespace: "default"
  name: "api-owning-group"
  notifyMembers: false
  # Required by the Group CRD even when the group has no members; the journey is
  # about the API<->group association, not membership.
  members: []
