                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                environmentId:
                  description: The environment ID defined in the management context
                  type: string
                errors:
                  description: >-
                    When the PDP gateway has been created regardless of errors,
                    this field is

                    used to persist the error...
                  properties:
                    severe:
                      description: >-
                        severe errors do not pass admission and will block
                        reconcile

                        hence, this field should always be...
                      items:
                        type: string
                      type: array
                    warning:
                      description: |-
                        warning errors do not block object reconciliation,
                        most of the time because the value is ignored or...
                      items:
                        type: string
                      type: array
                  type: object
                hrid:
                  description: >-
                    The human-readable ID the platform addresses this PDP
                    gateway by, derived from the

                    resource...
                  type: string
                id:
                  description: The ID of the PDP gateway in the Gravitee API Management instance
                  type: string
                organizationId:
                  description: The organization ID defined in the management context
                  type: string
                routingScope:
                  description: >-
                    targetPdpId@tag, or targetPdpId when untagged: what the
                    pdpRef of a schema, an entity or a

                    policy...
                  type: string
                wellKnownPath:
                  description: The AuthZEN discovery path of the endpoint.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
