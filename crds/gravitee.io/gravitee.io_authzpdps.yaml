apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    gravitee.io/operator.version: 4.14.0-rc
  name: authzpdps.gravitee.io
spec:
  group: gravitee.io
  names:
    kind: AuthzPdp
    listKind: AuthzPdpList
    plural: authzpdps
    shortNames:
      - graviteeauthzpdps
    singular: authzpdp
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.routingScope
          name: Routing Scope
          type: string
        - jsonPath: .spec.endpoint.path
          name: Endpoint
          type: string
        - jsonPath: .spec.strict
          name: Strict
          type: boolean
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: >-
            AuthzPdp is a PDP gateway of Gravitee Authorization Management as a
            Kubernetes resource: the

            engine...
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of
                an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object
                represents.
              type: string
            metadata:
              type: object
            spec:
              description: AuthzPdpSpec defines the desired state of an AuthzPdp.
              properties:
                contextRef:
                  description: >-
                    Reference to a ManagementContext that determines which APIM
                    instance this PDP gateway is

                    created in.
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                  x-kubernetes-validations:
                    - message: contextRef is immutable; delete and recreate the AuthzPdp
                      rule: self == oldSelf
                endpoint:
                  description: The AuthZEN endpoint of the PDP. Omitted, the PDP has none, and an
                    existing one is deleted.
                  properties:
                    path:
                      description: >-
                        Context path of the endpoint: unique among the APIs of
                        the environment, outside

                        /.
                      minLength: 1
                      type: string
                  required:
                    - path
                  type: object
                name:
                  description: Display name of the PDP gateway.
                  maxLength: 255
                  minLength: 1
                  type: string
                strict:
                  description: Whether the engine checks policies and entities against its schema.
                    Defaults to false.
                  type: boolean
                tag:
                  description: Sharding tag of the gateways that run the PDP; omit it for an
                    untagged gateway. Immutable.
                  maxLength: 64
                  pattern: ^-?[a-z0-9]+(-[a-z0-9]+)*$
                  type: string
                targetPdpId:
                  description: The PDP engine the gateway runs.
                  maxLength: 255
                  pattern: ^[A-Za-z0-9_.-]+$
                  type: string
              required:
                - contextRef
                - name
                - targetPdpId
              type: object
              x-kubernetes-validations:
                - messageExpression: "'targetPdpId is immutable: [' + oldSelf.targetPdpId + ']
                    cannot become [' + self.targetPdpId + ']; delete and
                    recreate the AuthzPdp'"
                  rule: self.targetPdpId == oldSelf.targetPdpId
                - messageExpression: "'tag is immutable: [' + (has(oldSelf.tag) ? oldSelf.tag :
                    '') + '] cannot become [' + (has(self.tag) ? self.tag : '')
                    + ']; delete and recreate the AuthzPdp'"
                  rule: "(has(self.tag) ? self.tag : '') == (has(oldSelf.tag) ? oldSelf.tag : '')"
            status:
              description: AuthzPdpStatus defines the observed state of an AuthzPdp.
              properties:
                conditions:
                  default: []
                  description: Conditions describe the current conditions of the AuthzPdp.
                  items:
                    description: Condition contains details for one aspect of the current state of
