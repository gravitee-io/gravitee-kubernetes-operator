                    instance
                  type: string
                organizationId:
                  description: The organization ID defined in the management context
                  type: string
                target:
                  description: The routing scope the platform publishes the document to, as it
                    answered the last apply.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
