                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                environmentId:
                  description: The environment ID defined in the management context
                  type: string
                errors:
                  description: >-
                    When the schema document has been created regardless of
                    errors, this field is

                    used to persist the...
                  properties:
