    singular: authzschema
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.target
          name: Target
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: AuthzSchema is a GAPL schema document of Gravitee Authorization
            Management as a Kubernetes...
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of
                an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object
                represents.
              type: string
            metadata:
              type: object
            spec:
              description: AuthzSchemaSpec defines the desired state of an AuthzSchema.
              properties:
                contextRef:
