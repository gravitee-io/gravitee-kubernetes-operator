                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                  x-kubernetes-validations:
                    - message: domainRef is immutable
                      rule: self == oldSelf
                    - message: domainRef.name must not be empty
                      rule: size(self.name) > 0
