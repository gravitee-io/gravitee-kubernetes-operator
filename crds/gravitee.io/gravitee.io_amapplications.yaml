                  default: true
                  description: >-
                    Enabled Whether the application is enabled. Disabling it
                    revokes its tokens.

                    Defaults to true.
                  type: boolean
                identityProviders:
                  description: IdentityProviders Identity providers users can authenticate with on
                    this application.
