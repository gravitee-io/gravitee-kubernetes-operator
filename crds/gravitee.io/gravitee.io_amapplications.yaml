              type: string
            metadata:
              type: object
            spec:
              description: AMApplicationSpec defines the desired state of an AM application.
              properties:
                certificate:
                  description: Certificate AM key of a certificate of the domain, or id:<uuid>.
                  type: string
                certificateRef:
                  description: CertificateRef AMCertificate of the application's namespace and
                    domain, sent to AM as its key.
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                  x-kubernetes-validations:
                    - message: certificateRef.name must not be empty
                      rule: size(self.name) > 0
                clientId:
                  description: ClientId OAuth 2.0 client identifier. Generated when omitted on
                    creation.
                  type: string
                description:
                  description: Description Description of the application.
                  type: string
                domainRef:
                  description: DomainRef Domain CRD reference
