apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    gravitee.io/operator.version: 4.14.0-rc
  name: authzentities.gravitee.io
spec:
  group: gravitee.io
  names:
    kind: AuthzEntity
    listKind: AuthzEntityList
    plural: authzentities
    shortNames:
      - graviteeauthzentities
    singular: authzentity
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.entityId
          name: Entity ID
          type: string
        - jsonPath: .spec.entityType
          name: Type
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: AuthzEntity is a principal or a resource of Gravitee Authorization
            Management as a Kubernetes...
          properties:
            apiVersion:
              description: APIVersion defines the versioned schema of this representation of
                an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object
                represents.
              type: string
            metadata:
              type: object
            spec:
              description: AuthzEntitySpec defines the desired state of an AuthzEntity.
              properties:
                active:
                  default: true
                  description: Whether the entity is published to the PDP gateways it targets.
                  type: boolean
                attributes:
                  description: Attributes of the entity, replaced whole on every apply.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                contextRef:
                  description: >-
                    Reference to a ManagementContext that determines which APIM
                    instance this entity is created

                    in.
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                  type: object
                  x-kubernetes-validations:
                    - message: contextRef is immutable
                      rule: self == oldSelf
                entityId:
                  description: 'Id of the entity in policies, without its type: agents, not
                    Group::"agents".'
                  maxLength: 255
                  minLength: 1
                  type: string
                entityType:
                  description: "Type of the entity, spelled the way the engine spells it: Group,
                    not group."
                  maxLength: 255
                  pattern: ^[_a-zA-Z][_a-zA-Z0-9]*(?:::[_a-zA-Z][_a-zA-Z0-9]*)*$
                  type: string
                kind:
                  description: Whether the entity acts (PRINCIPAL) or is acted upon (RESOURCE).
                    Immutable.
                  enum:
                    - PRINCIPAL
                    - RESOURCE
                  type: string
                parents:
                  description: The entities this one is a member of, replaced whole on every
                    apply.
                  items:
                    description: Parent is an entity this one is a member of, spelled the way the
                      engine spells it.
                    properties:
                      entityId:
                        description: Id of the parent, under the same rule as entityId.
                        maxLength: 255
                        minLength: 1
                        type: string
                      entityType:
                        description: "Type of the parent, spelled the way the engine spells it: Group,
                          not group."
                        maxLength: 255
                        pattern: ^[_a-zA-Z][_a-zA-Z0-9]*(?:::[_a-zA-Z][_a-zA-Z0-9]*)*$
                        type: string
                    required:
                      - entityId
                      - entityType
                    type: object
                  type: array
                targets:
                  description: The PDP gateways the entity is published to.
                  items:
                    description: >-
                      Target names the PDP gateway a resource is published to:
                      an AuthzPdp through pdpRef, or a

                      routing...
                    properties:
                      pdpRef:
                        description: >-
                          The AuthzPdp whose status.routingScope is the target,
                          its namespace defaulted to the

                          resource's.
                        properties:
                          kind:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                          - name
                        type: object
                      scope:
                        description: >-
                          A routing scope written as the gateway reports it:
                          targetPdpId@tag, targetPdpId when

                          untagged,...
                        maxLength: 320
                        pattern: ^(\*|[A-Za-z0-9_.-]+(@-?[a-z0-9]+(-[a-z0-9]+)*)?)$
                        type: string
                    type: object
                    x-kubernetes-validations:
                      - message: set pdpRef or scope, not both
                        rule: has(self.pdpRef) != has(self.scope)
                  type: array
              required:
                - contextRef
                - entityId
                - entityType
                - kind
              type: object
              x-kubernetes-validations:
                - messageExpression: "'entityId is immutable: was [' + oldSelf.entityId + ']'"
                  rule: self.entityId == oldSelf.entityId
                - messageExpression: "'kind is immutable: was [' + oldSelf.kind + ']'"
                  rule: self.kind == oldSelf.kind
                - messageExpression: "'entityType is immutable: was [' + oldSelf.entityType + ']'"
                  rule: self.entityType == oldSelf.entityType
            status:
              description: AuthzEntityStatus defines the observed state of an AuthzEntity.
              properties:
                conditions:
                  default: []
                  description: Conditions describe the current conditions of the AuthzEntity.
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                environmentId:
                  description: The environment ID defined in the management context
                  type: string
                errors:
                  description: >-
                    When the entity has been created regardless of errors, this
                    field is

                    used to persist the error...
                  properties:
                    severe:
                      description: >-
                        severe errors do not pass admission and will block
                        reconcile

                        hence, this field should always be...
                      items:
                        type: string
                      type: array
                    warning:
                      description: |-
                        warning errors do not block object reconciliation,
                        most of the time because the value is ignored or...
                      items:
                        type: string
                      type: array
                  type: object
                hrid:
                  description: >-
                    The human-readable ID the platform addresses this entity by,
                    derived from the resource

                    namespace...
                  type: string
                id:
                  description: The ID of the entity in the Gravitee API Management instance
                  type: string
                organizationId:
                  description: The organization ID defined in the management context
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
