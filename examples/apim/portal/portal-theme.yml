apiVersion: gravitee.io/v1alpha1
kind: PortalTheme
metadata:
  name: default-theme
spec:
  contextRef:
    name: "dev-ctx"
  name: "Default Theme"
  definition:
    customCss: |
      .portal { padding: 0; }
    font:
      fontFamily: '"Inter", sans-serif'
    color:
      primary: "#123456"
      secondary: "#654321"
      tertiary: "#abcdef"
      error: "#ff0000"
      background:
        page: "#ffffff"
        card: "#f4f4f4"
  # Images are inline data URIs, as produced by the console on upload.
  favicon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
