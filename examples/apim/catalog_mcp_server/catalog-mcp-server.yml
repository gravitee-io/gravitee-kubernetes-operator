apiVersion: v1
kind: Secret
metadata:
  name: github-mcp
stringData:
  # The full header value, as the catalog expects it.
  token: "Bearer ghp_replace_me"
---
apiVersion: gravitee.io/v1alpha1
kind: CatalogMcpServer
metadata:
  name: github
spec:
  contextRef:
    name: dev-ctx
  # Declared and immutable: the identity an authorization policy names.
  entityId: mcp-server.github
  description: GitHub tools for coding agents
  connection:
    endpoint: https://api.githubcopilot.com/mcp/
    transport: HTTP
    auth:
      type: HEADER
      header:
        name: Authorization
        # Resolved by the operator before the platform is called, never returned.
        value: "[[ secret `github-mcp/token` ]]"
