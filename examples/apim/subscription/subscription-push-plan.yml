apiVersion: gravitee.io/v1alpha1
kind: Subscription
metadata:
  name: webhook-push-subscription
spec:
  api:
    name: api-v4-message-webhook-push-plan
  application:
    name: simple-application-with-client-id
  plan: Default-PUSH-plan
  # Required on a PUSH plan: the entrypoint that delivers messages, and its subscriber settings.
  consumerConfiguration:
    entrypointId: webhook
    entrypointConfiguration:
      callbackUrl: "https://example.com/webhook"
      auth:
        type: none
      ssl:
        hostnameVerifier: false
        trustAll: false
      retry:
        retryOption: "No Retry"
