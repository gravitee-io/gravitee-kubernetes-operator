apiVersion: gravitee.io/v1alpha1
kind: Application
metadata:
  name: backend-to-backend-application
spec:
  contextRef:
    name: "dev-ctx"
  name: "backend-to-backend-application"
  description: "OAuth settings for machine to machine interaction"
  domain: "examples.com"
  notifyMembers: true
  background: "https://upload.wikimedia.org/wikipedia/commons/d/df/Green_Red_Gradient_Background.png"
  pictureUrl: "https://upload.wikimedia.org/wikipedia/fr/0/09/Logo_App_Store_d%27Apple.png"
  groups:
    - "developers"
  members:
    - role: "USER"
      source: "memory"
      sourceId: "application1"
  settings:
    oauth:
      applicationType: BACKEND_TO_BACKEND
      redirectUris:
        - "https://example.com"
      grantTypes:
        - "client_credentials"
    tls:
      clientCertificates:
        - name: "default"
          startsAt: "2020-01-01T00:00:00Z"
          endsAt: "2100-01-01T00:00:00Z"
          encoded: false
          # content: to be set
  metadata:
    - name: "test metadata 1"
      format: DATE
