# software_id selects a client template on the registration provider (e.g. an AM template
# application), so the created client inherits its identity providers, claims and flows.
apiVersion: gravitee.io/v1alpha1
kind: Application
metadata:
  name: client-template-application
spec:
  contextRef:
    name: "dev-ctx"
  name: "client-template-application"
  description: "OAuth client registered from a provider-side client template"
  settings:
    oauth:
      applicationType: BACKEND_TO_BACKEND
      grantTypes:
        - "client_credentials"
      additionalClientMetadata:
        software_id: "3d5a2f0e-1c4b-4c8a-9f7e-2b6d8e0a1c34"
