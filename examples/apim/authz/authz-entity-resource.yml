# A resource published to the default engine, which no AuthzPdp declares: written as its routing
# scope. A gateway created in the Console is written the same way (targetPdpId@tag).
apiVersion: gravitee.io/v1alpha1
kind: AuthzEntity
metadata:
  name: grand-paris
spec:
  contextRef:
    name: dev-ctx
  entityId: grand-paris
  kind: RESOURCE
  entityType: Hotel
  attributes:
    city: Paris
  targets:
    - scope: default
