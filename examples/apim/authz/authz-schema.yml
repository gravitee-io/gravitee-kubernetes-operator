# The travel schema document, enforced by the orders PDP gateway of authz-pdp.yml. The pdpRef
# resolves to that AuthzPdp's routing scope (orders@eu) once it has synced: applied first, the
# schema waits on ResolvedRefs=False.
apiVersion: gravitee.io/v1alpha1
kind: AuthzSchema
metadata:
  name: travel-schema
spec:
  contextRef:
    name: dev-ctx
  name: Travel schema
  target:
    pdpRef:
      name: orders-eu
  schema: |
    entity User in Group;
    entity Hotel;
    action read appliesTo { principal: User, resource: Hotel };
