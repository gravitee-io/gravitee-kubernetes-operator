# Every field: two parents, a nested attribute, inactive, published to the AuthzPdp of
# authz-pdp-drift-full.yml and to the default engine. That gateway is strict: the schema document
# of authz-schema-drift-full.yml declares User's attributes.
apiVersion: gravitee.io/v1alpha1
kind: AuthzEntity
metadata:
  name: drift-full
spec:
  contextRef:
    name: dev-ctx
  entityId: drift-full
  kind: PRINCIPAL
  entityType: User
  attributes:
    department: travel
    address:
      city: Paris
      country: France
  parents:
    - entityType: Group
      entityId: agents
    - entityType: Group
      entityId: travel
  active: false
  targets:
    - pdpRef:
        name: drift-full
    - scope: default
