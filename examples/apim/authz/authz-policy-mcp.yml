# Engineers may call the create_issue tool of the Studio in
# examples/apim/mcp_proxy/mcp-studio.yml, which sets enableFGA. The resource is the tool's
# authPolicyRef, as the CatalogMcpServer and McpProxy status report it, not its catalog id
# (mcp-tool.github.create_issue): the platform warns about a policy that names the catalog id.
# Without targets, the policy is deployed to the default engine on every gateway, the only engine
# an MCP proxy asks.
apiVersion: gravitee.io/v1alpha1
kind: AuthzPolicy
metadata:
  name: github-create-issue
spec:
  contextRef:
    name: dev-ctx
  entityId: policy.github.create-issue
  name: Engineering creates GitHub issues
  policyType: MCP
  policyText: |
    permit(
      principal in Group::"engineering",
      action == Action::"github.create_issue",
      resource == MCPTool::"github.create_issue"
    );
