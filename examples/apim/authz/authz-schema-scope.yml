# A schema document targeting a PDP gateway no AuthzPdp declares: default here, or a gateway
# created in the Console, written as its routing scope (targetPdpId@tag).
apiVersion: gravitee.io/v1alpha1
kind: AuthzSchema
metadata:
  name: default-schema
spec:
  contextRef:
    name: dev-ctx
  name: Default schema
  target:
    scope: default
  schema: |
    entity User;
    entity Document;
    action view appliesTo { principal: [User], resource: [Document] };
