# Every field: a permit and a forbid, deployed to the AuthzPdp of authz-pdp-drift-full.yml and to
# the default engine. That gateway is strict: the schema document of authz-schema-drift-full.yml
# declares User, Group, Hotel and the read action.
apiVersion: gravitee.io/v1alpha1
kind: AuthzPolicy
metadata:
  name: drift-full
spec:
  contextRef:
    name: dev-ctx
  entityId: policy.drift.full
  name: Drift full
  policyType: API
  policyText: |
    permit(principal in Group::"agents", action == Action::"read", resource == Hotel::"grand-paris");
    forbid(principal, action == Action::"read", resource == Hotel::"closed");
  targets:
    - pdpRef:
        name: drift-full
    - scope: default
