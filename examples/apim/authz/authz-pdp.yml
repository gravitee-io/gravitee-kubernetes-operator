# The orders PDP gateway, eu tag. The platform routes it as orders@eu and serves its AuthZEN
# endpoint under /authz/orders-eu. Schemas, entities and policies target it with a pdpRef.
apiVersion: gravitee.io/v1alpha1
kind: AuthzPdp
metadata:
  name: orders-eu
spec:
  contextRef:
    name: dev-ctx
  name: Orders PDP (EU)
  targetPdpId: orders
  tag: eu
  strict: true
  endpoint:
    path: /authz/orders-eu
