apiVersion: gravitee.io/v1alpha1
kind: McpProxy
metadata:
  name: drift-minimal
spec:
  contextRef:
    name: dev-ctx
  entityId: mcp-proxy.drift-minimal
  name: Drift minimal
  contextPath: /mcp/drift-minimal
  protocolVersion: "2025-03-26"
  proxy:
    serverUrl: https://mcp.example.com/mcp
  plans:
    - name: Keyless
      security:
        type: KEY_LESS
