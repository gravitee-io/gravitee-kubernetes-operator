# A Studio selecting tools from the CatalogMcpServer in
# examples/apim/catalog_mcp_server/catalog-mcp-server.yml. Applied before that server has
# synced, it waits (ResolvedRefs=False) and converges once the server is registered.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
stringData:
  client-secret: "replace_me"
---
apiVersion: gravitee.io/v1alpha1
kind: McpProxy
metadata:
  name: dev-tools
spec:
  contextRef:
    name: dev-ctx
  entityId: mcp-proxy.dev-tools
  name: Developer Tools
  contextPath: /mcp/dev-tools
  protocolVersion: "2025-03-26"
  mode: STUDIO
  studio:
    tools:
      # serverRef names a CatalogMcpServer; the namespace defaults to the proxy's.
      - serverRef:
          name: github
        tool: create_issue
      - serverRef:
          name: github
        tool: list_pull_requests
        alias: list_prs
    # One entry per server a selected tool comes from; type NONE when it needs no credential.
    upstreamAuth:
      - serverRef:
          name: github
        auth:
          type: BEARER
          bearer:
            token: "[[ secret `github-mcp-upstream/token` ]]"
    # Inserts the tool-level authorization policy on tools/call.
    enableFGA: true
  identityProviders:
    - name: keycloak
      type: OAUTH2_GENERIC
      oauth2Generic:
        issuerUrl: https://keycloak.example.com/realms/gravitee
        introspectionEndpoint: /protocol/openid-connect/token/introspect
        introspectionEndpointMethod: POST
        clientId: gravitee
        clientSecret: "[[ secret `keycloak/client-secret` ]]"
  plans:
    - name: Default
      security:
        type: OAUTH2
        oauth2:
          provider: keycloak
