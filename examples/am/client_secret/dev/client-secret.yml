# Test manifest: an AMClientSecret of the application under test. The fixture suffixes its name and the name
# of its Secret; the tests create the Secret with the value they need.
apiVersion: gravitee.io/v1alpha1
kind: AMClientSecret
metadata:
  name: client-secret
spec:
  applicationRef:
    name: mobile-app
  secretRef:
    name: client-secret
    key: client-secret
