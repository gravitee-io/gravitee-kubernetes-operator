# A client secret of the mobile-app AMApplication (examples/am/application/application-minimal.yml).
# The value is read from the Secret entry below and sent to AM; it is never written back to the cluster and
# never returned by AM. Replace the placeholder with your own value, at least 43 characters, for example with:
#   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
# The placeholder is shorter than that on purpose: AM rejects it until it is replaced.
#
# Apply them in any order: until the application and the Secret exist, the client secret is not created in AM
# and stays ResolvedRefs=False. A secret is immutable: see README.md to rotate it.
apiVersion: v1
kind: Secret
metadata:
  name: mobile-app-secret-2026-11
type: Opaque
stringData:
  client-secret: CHANGE-ME-run-the-openssl-command-above
---
apiVersion: gravitee.io/v1alpha1
kind: AMClientSecret
metadata:
  name: mobile-app-2026-11
spec:
  applicationRef:
    name: mobile-app
  secretRef:
    name: mobile-app-secret-2026-11
    key: client-secret
