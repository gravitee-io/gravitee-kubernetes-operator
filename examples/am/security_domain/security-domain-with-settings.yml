apiVersion: gravitee.io/v1alpha1
kind: AMSecurityDomain
metadata:
  name: full-domain
spec:
  name: Full Security Domain
  path: /full
  enabled: true
  description: A domain with extended settings
  tags:
    - production
    - external
  corsSettings:
    enabled: true
    allowedOrigins:
      - https://example.com
    allowedMethods:
      - GET
      - POST
    allowedHeaders:
      - Authorization
      - Content-Type
    allowCredentials: true
    maxAge: 3600
  loginSettings:
    forgotPasswordEnabled: true
    registerEnabled: true
    rememberMeEnabled: true
    passwordlessEnabled: false
    identifierFirstEnabled: false
  passwordSettings:
    minLength: 12
    maxLength: 128
    includeNumbers: true
    includeSpecialCharacters: true
    lettersInMixedCase: true
    maxConsecutiveLetters: 3
    passwordHistoryEnabled: true
    oldPasswords: 5
  accountSettings:
    loginAttemptsDetectionEnabled: true
    maxLoginAttempts: 5
    loginAttemptsResetTime: 600
    accountBlockedDuration: 1800
    sendRecoverAccountEmail: true
  scim:
    enabled: true
  contextRef:
    name: am-ctx
