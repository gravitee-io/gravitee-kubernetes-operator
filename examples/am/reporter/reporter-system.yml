# The domain's system reporter: AM builds it from its domains.reporters.default.* settings,
# so only domainRef is set. name, type, configuration, attributeMappings and attributeMappingEventTypes
# would be ignored.
#
# AM does not create a default reporter for a domain managed by GKO: until an AMReporter is applied, the
# domain's audit events are not persisted. Apply this one to get AM's default reporter back.
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: banking-system-reporter
  namespace: banking
spec:
  domainRef:
    name: banking
  system: true
