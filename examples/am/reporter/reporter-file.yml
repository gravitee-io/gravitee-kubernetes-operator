# A file reporter of the "banking" domain: audit events written to the banking-audit file, kept 7 days.
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: banking-audit-file
  namespace: banking
spec:
  domainRef:
    name: banking
  name: Banking audit to file
  type: reporter-am-file
  configuration:
    filename: banking-audit
    retainDays: 7
