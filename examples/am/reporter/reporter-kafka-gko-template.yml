# A Kafka reporter of the "banking" domain, its password taken from a Kubernetes Secret by a GKO template.
# AM key of this reporter: banking-banking-audit-kafka.
#
# No AM configuration is needed: GKO resolves the password and sends it to AM, which then stores it in its
# database (masked on read). Rotating the Secret re-sends the reporter. To keep the password out of AM's
# database, see reporter-kafka-am-secret-provider.yml.
#
# kubectl create secret generic banking-audit -n banking --from-literal=password=changeme
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: banking-audit-kafka
  namespace: banking
spec:
  domainRef:
    name: banking
  name: Banking audit to Kafka
  type: reporter-am-kafka
  configuration:
    bootstrapServers: kafka.banking.svc:9092
    topic: banking-audit
    acks: "1"
    username: gravitee
    # Resolved by GKO.
    password: "[[ secret `banking-audit/password` ]]"
