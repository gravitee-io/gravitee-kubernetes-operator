# A Kafka reporter of the "banking" domain, sending its audit events to the banking-audit topic.
# AM key of this reporter: banking-banking-audit-kafka.
#
# The Kafka password is resolved by AM at load time, so it is never stored in clear in AM. This requires,
# on BOTH the AM management API (dry-run and validation load the reporter) and the AM gateway:
#   domains:
#     secrets:
#       providers:
#         - plugin: kubernetes
#           configuration:
#             enabled: true
# and AM's service accounts allowed to "get" Secrets in the namespace.
#
# kubectl create secret generic banking-audit -n banking --from-literal=password=changeme
apiVersion: gravitee.io/v1alpha1
kind: AMReporter
metadata:
  name: banking-audit-kafka
  namespace: banking
spec:
  domainRef:
    name: banking
  name: Banking audit to Kafka
  type: reporter-am-kafka
  configuration:
    bootstrapServers: kafka.banking.svc:9092
    topic: banking-audit
    acks: "1"
    username: gravitee
    # Resolved by AM at load time.
    password: "{#secrets.get('/kubernetes/banking-audit:password?namespace=banking')}"
