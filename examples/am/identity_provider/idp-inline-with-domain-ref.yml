# An inline identity provider (users defined in the configuration) under the basic-domain AMSecurityDomain.
apiVersion: gravitee.io/v1alpha1
kind: AMIdentityProvider
metadata:
  name: inline-idp
spec:
  domainRef:
    name: basic-domain
  name: Inline users
  type: inline-am-idp
  configuration:
    users:
      - username: jdoe
        firstname: John
        lastname: Doe
        email: john.doe@example.com
        password: change-me
