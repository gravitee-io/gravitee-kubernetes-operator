# The same inline identity provider, its password read from a Secret through templating.
apiVersion: v1
kind: Secret
metadata:
  name: idp-users
stringData:
  admin-password: change-me
---
apiVersion: gravitee.io/v1alpha1
kind: AMIdentityProvider
metadata:
  name: inline-idp-with-secret
spec:
  domainRef:
    name: basic-domain
  name: Inline users from a secret
  type: inline-am-idp
  configuration:
    users:
      - username: admin
        firstname: Admin
        lastname: User
        email: admin@example.com
        password: "[[ secret `idp-users/admin-password` ]]"
