# A PKCS#12 certificate of the "banking" domain, its keystore and passwords taken from a Kubernetes Secret.
# AM key of this certificate: banking-banking-signing. A domain using it as fallback sets
# certificateSettings.fallbackCertificate: banking-banking-signing.
#
# The keystore file field is resolved by GKO (AM cannot resolve it). It is AM's format as is: a JSON string
# {"name":"...","content":"<base64>"}, not an object. GKO does not encode the keystore.
#
# The passwords are resolved by AM at load time, so they are never stored in clear in AM. This requires,
# on BOTH the AM management API (dry-run and validation load the keystore) and the AM gateway:
#   domains:
#     secrets:
#       providers:
#         - plugin: kubernetes
#           configuration:
#             enabled: true
# and AM's service accounts allowed to "get" Secrets in the namespace. Only storepass and keypass are
# resolvable by AM; the file field is not.
#
# Alternative without AM configuration: a GKO template, e.g. storepass: "[[ secret `banking-signing/storepass` ]]".
# The password is then resolved by GKO and stored in AM's database (masked on read).
#
# kubectl create secret generic banking-signing -n banking \
#   --from-literal=storepass=changeme --from-literal=keypass=changeme \
#   --from-literal=keystore.b64="$(base64 < keystore.p12 | tr -d '\n')"
apiVersion: gravitee.io/v1alpha1
kind: AMCertificate
metadata:
  name: banking-signing
  namespace: banking
spec:
  domainRef:
    name: banking
  name: Token signing
  type: pkcs12-am-certificate
  configuration:
    # File field: resolved by GKO. A JSON string, not an object.
    content: '{"name":"keystore.p12","content":"[[ secret `banking-signing/keystore.b64` ]]"}'
    alias: signing
    # Passwords: resolved by AM at load time.
    storepass: "{#secrets.get('/kubernetes/banking-signing:storepass?namespace=banking')}"
    keypass: "{#secrets.get('/kubernetes/banking-signing:keypass?namespace=banking')}"
    algorithm: RS256
    use: [sig]
