# Test certificate: PKCS#12, keystore and passwords inline. The keystore is a placeholder, not a real
# PKCS#12 file: the AM mock stores it as sent. domainRef is set by the test fixtures.
apiVersion: gravitee.io/v1alpha1
kind: AMCertificate
metadata:
  name: certificate-pkcs12-inline
spec:
  domainRef:
    name: basic-domain
  name: Inline signing certificate
  type: pkcs12-am-certificate
  configuration:
    content: '{"name":"keystore.p12","content":"aW5saW5lLWtleXN0b3Jl"}'
    alias: signing
    storepass: changeme
    keypass: changeme
    algorithm: RS256
    use: [sig]
