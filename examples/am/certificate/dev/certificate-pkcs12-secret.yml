# Test certificate: PKCS#12, keystore and passwords taken from the am-certificate-keystore Secret through GKO
# templates, without any AM secret provider. domainRef is set by the test fixtures.
apiVersion: gravitee.io/v1alpha1
kind: AMCertificate
metadata:
  name: certificate-pkcs12-secret
spec:
  domainRef:
    name: basic-domain
  name: Secret-backed signing certificate
  type: pkcs12-am-certificate
  configuration:
    content: '{"name":"keystore.p12","content":"[[ secret `am-certificate-keystore/keystore.b64` ]]"}'
    alias: signing
    storepass: "[[ secret `am-certificate-keystore/storepass` ]]"
    keypass: "[[ secret `am-certificate-keystore/keypass` ]]"
    algorithm: RS256
    use: [sig]
