# A web application of the basic-domain AMSecurityDomain whose certificate and identity providers are given
# as AM keys, for resources GKO does not manage: a key, or id:<uuid> for one created before keys existed.
# AM keys are not checked by GKO nor by AM and not waited for: the application is created right away, and
# each reference resolves whenever that resource exists in AM.
#
# The key of a resource managed by GKO is its namespace and name: default-system-certificate for the
# system-certificate AMCertificate of the default namespace. Prefer certificateRef / identityRef for those.
apiVersion: gravitee.io/v1alpha1
kind: AMApplication
metadata:
  name: back-office
spec:
  domainRef:
    name: basic-domain
  name: Back office
  type: web
  certificate: legacy-signing
  identityProviders:
    - identity: corporate-ldap
      priority: 0
    - identity: id:6f1c3e2a-9b7d-4c1e-8f0a-2d5b7e9c4a11
      priority: 1
  settings:
    oauth:
      redirectUris: ["https://back-office.example.com/callback"]
