# A native application of the basic-domain AMSecurityDomain with its OAuth settings, signing its tokens with
# the domain's system certificate (examples/am/certificate/certificate-system.yml) and authenticating users
# against the inline-idp identity provider (examples/am/identity_provider/idp-inline-with-domain-ref.yml).
# AM generates its clientId: read it from status.clientId.
#
# Client secrets are not part of the application: declare an AMClientSecret referencing it (AM-7961).
# The application has no secret until then.
#
# certificateRef and identityRef point to CRs of the application's namespace and domain. The application
# waits for them: until they exist, it is not created in AM and stays ResolvedRefs=False. A ref to another
# namespace or to a CR of another domain is rejected.
#
# Scopes are referenced by key and must exist in the domain (openid is created by AM with every domain).
apiVersion: gravitee.io/v1alpha1
kind: AMApplication
metadata:
  name: mobile-banking
spec:
  domainRef:
    name: basic-domain
  name: Mobile Banking
  description: Customer mobile client
  type: native
  certificateRef:
    name: system-certificate
  metadata:
    owner: payments-team
  settings:
    oauth:
      grantTypes: ["authorization_code", "refresh_token"]
      redirectUris: ["com.example.app://callback"]
      scopeSettings:
        - scope: openid
          defaultScope: true
  identityProviders:
    - identityRef:
        name: inline-idp
      priority: 0
