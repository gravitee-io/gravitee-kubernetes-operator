# A minimal native application of the basic-domain AMSecurityDomain (examples/am/security_domain), signing
# its tokens with the domain's system certificate (examples/am/certificate/certificate-system.yml).
# AM generates its clientId: read it from status.clientId. The application has no client secret until an
# AMClientSecret references it.
#
# The application waits for its certificate: until the AMCertificate exists, it is not created in AM and stays
# ResolvedRefs=False. Apply them in any order.
apiVersion: gravitee.io/v1alpha1
kind: AMApplication
metadata:
  name: mobile-app
spec:
  domainRef:
    name: basic-domain
  name: Mobile App
  type: native
  certificateRef:
    name: system-certificate
  settings:
    oauth:
      # AM requires at least one redirect URI for a native application.
      redirectUris: ["com.example.mobile://callback"]
