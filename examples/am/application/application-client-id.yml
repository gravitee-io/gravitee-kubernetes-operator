# A service application of the basic-domain AMSecurityDomain with a clientId of its own instead of one
# generated by AM. clientId is immutable once set: changing or removing it is rejected. It must be unique in
# the domain.
apiVersion: gravitee.io/v1alpha1
kind: AMApplication
metadata:
  name: payments-batch
spec:
  domainRef:
    name: basic-domain
  name: Payments batch
  type: service
  clientId: payments-batch
  certificateRef:
    name: system-certificate
  settings:
    oauth:
      grantTypes: ["client_credentials"]
