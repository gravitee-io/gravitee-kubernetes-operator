# A web application of the basic-domain AMSecurityDomain requiring MFA enrollment.
# MFA factors have no Automation API endpoint: they are referenced by id:<uuid>, the id AM gave the factor
# (AM console, domain settings, Multifactor Auth). Replace the one below with a factor of your domain.
apiVersion: gravitee.io/v1alpha1
kind: AMApplication
metadata:
  name: web-banking
spec:
  domainRef:
    name: basic-domain
  name: Web Banking
  type: web
  certificateRef:
    name: system-certificate
  settings:
    oauth:
      redirectUris: ["https://banking.example.com/callback"]
    mfa:
      enroll:
        active: true
        type: required
      factor:
        defaultFactorId: id:0b8e4c6a-3f2d-4e1b-9a7c-5d6e8f9a1b2c
        applicationFactors:
          - id: id:0b8e4c6a-3f2d-4e1b-9a7c-5d6e8f9a1b2c
