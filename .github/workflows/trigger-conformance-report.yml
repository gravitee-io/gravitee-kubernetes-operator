name: Trigger Conformance Report

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Which version should we report conformance for ?"
        required: true
        type: string
      dry-run:
        description: "Should this run as a dry run ? (build the report and the commit, push nothing)"
        required: true
        default: true
        type: boolean
jobs:
  trigger-conformance-report:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry-run }}
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Trigger conformance report pipeline"
        run: |
          echo "📋 Reporting conformance for version ${VERSION}"
          echo "    Dry run: ${DRY_RUN}"
          npx zx hack/scripts/trigger-conformance-report.mjs \
           --version ${VERSION} \
           --dry-run ${DRY_RUN}
